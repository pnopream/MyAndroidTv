
name: Build MyAndroidTV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/myandroidtv
          mkdir -p app/src/main/assets/www

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyAndroidTV"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.myandroidtv'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.myandroidtv'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="MyAndroidTV"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/myandroidtv/MainActivity.java <<'EOF'
          package com.myandroidtv;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.View;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );

                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/www/index.html");
              }

              @Override
              public void onBackPressed() {
                  setContentView(new WebView(this));
                  super.onBackPressed();
              }
          }
          EOF

      - name: Extract HTML files
        run: |
          mkdir -p source
          ZIP=$(find . -maxdepth 2 -type f -iname 'MyAndroidTV.zip' | head -n 1)

          if [ -n "$ZIP" ]; then
            unzip -oq "$ZIP" -d source
          fi

          HTML=$(find . -type f -name index.html \
            -not -path './app/*' \
            -not -path './.git/*' | head -n 1)

          if [ -z "$HTML" ]; then
            echo "ERROR: Khong tim thay index.html"
            exit 1
          fi

          cp -R "$(dirname "$HTML")"/. app/src/main/assets/www/

          if [ ! -f app/src/main/assets/www/index.html ]; then
            echo "ERROR: Khong co index.html trong assets"
            exit 1
          fi

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyAndroidTV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
