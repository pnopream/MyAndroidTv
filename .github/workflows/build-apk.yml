
      - name: Extract HTML files
        run: |
          mkdir -p source

          ZIP=$(find . -maxdepth 2 -type f -iname '*.zip' \
            -not -path './.git/*' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Khong tim thay file ZIP"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Dang giai nen: $ZIP"
          unzip -oq "$ZIP" -d source

          HTML=$(find source -type f -name index.html | head -n 1)

          if [ -z "$HTML" ]; then
            echo "ERROR: ZIP khong chua index.html"
            find source -maxdepth 5 -type f
            exit 1
          fi

          echo "Tim thay HTML: $HTML"
          cp -R "$(dirname "$HTML")"/. app/src/main/assets/www/
